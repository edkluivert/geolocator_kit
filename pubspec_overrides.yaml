# Generated by dn (`dn pub get`, `dn run`); new projects gitignore it.
#
# The closed DartNative packages (dartnative, dartnative_ios, …) ship inside
# the SDK, not on pub.dev. These overrides point them at header copies under
# .dart_tool/dartnative_sdk/ so a plain `dart pub get` — Android Studio,
# VS Code, CI — resolves them without the dn tool. After cloning, run
# `dn pub get` once to create the copies.
dependency_overrides:
  # -- your overrides (kept as they are) --
  # -- mirrored from pubspec.yaml dependency_overrides (edit them there) --
  # -- managed by dn: closed DartNative packages (rewritten on every resolve) --
  dartnative:
    path: .dart_tool/dartnative_sdk/dartnative
